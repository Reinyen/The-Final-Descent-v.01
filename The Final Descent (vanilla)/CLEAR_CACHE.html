<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cache Cleared</title>
</head>
<body>
    <h1>Cache Cleared - Reload Complete</h1>
    <p>Your browser cache has been cleared with cache-busting.</p>
    <p><a href="roster-selection.html?nocache=1764717288749">Go to Roster Selection (No Cache)</a></p>
    <script>
        // Force clear cache
        if ('caches' in window) {
            caches.keys().then(names => {
                names.forEach(name => {
                    caches.delete(name);
                    console.log('Deleted cache:', name);
                });
            });
        }
        console.log('Service worker cache cleared');
    </script>
</body>
