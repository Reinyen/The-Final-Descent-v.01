<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roster Test</title>
  <style>
    body {
      margin: 0;
      background: #06070a;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border: 1px solid #0f0;
      color: #0f0;
      font-family: monospace;
      z-index: 10000;
    }
    #status h3 { margin: 0 0 10px 0; color: #0ff; }
    .pass { color: #0f0; }
    .fail { color: #f00; }
  </style>
</head>
<body>
  <div id="status">
    <h3>🧪 Roster Module Test</h3>
    <div id="results">Loading...</div>
  </div>
  <div id="rosterRoot"></div>

  <script type="module">
    const results = [];

    function test(name, fn) {
      try {
        fn();
        results.push(`<div class="pass">✓ ${name}</div>`);
      } catch (err) {
        results.push(`<div class="fail">✗ ${name}: ${err.message}</div>`);
      }
    }

    async function runTests() {
      // Test 1: Core modules
      try {
        const { initSelection } = await import('./core/rosterSelection.js');
        test('Core: rosterSelection.js', () => {
          if (typeof initSelection !== 'function') throw new Error('initSelection not found');
        });
      } catch (err) {
        results.push(`<div class="fail">✗ Core: rosterSelection.js - ${err.message}</div>`);
      }

      try {
        const { createRosterStore } = await import('./core/rosterStore.js');
        test('Core: rosterStore.js', () => {
          if (typeof createRosterStore !== 'function') throw new Error('createRosterStore not found');
        });
      } catch (err) {
        results.push(`<div class="fail">✗ Core: rosterStore.js - ${err.message}</div>`);
      }

      // Test 2: FX modules
      try {
        const { createCinematicController } = await import('./fx/cinematicController.js');
        test('FX: cinematicController.js', () => {
          if (typeof createCinematicController !== 'function') throw new Error('createCinematicController not found');
        });
      } catch (err) {
        results.push(`<div class="fail">✗ FX: cinematicController.js - ${err.message}</div>`);
      }

      try {
        const { createRerollVFXController } = await import('./fx/rerollVFXController.js');
        test('FX: rerollVFXController.js', () => {
          if (typeof createRerollVFXController !== 'function') throw new Error('createRerollVFXController not found');
        });
      } catch (err) {
        results.push(`<div class="fail">✗ FX: rerollVFXController.js - ${err.message}</div>`);
      }

      // Test 3: Main integration
      try {
        const { initializeRosterSelection } = await import('./rosterMain.js');
        test('Integration: rosterMain.js', () => {
          if (typeof initializeRosterSelection !== 'function') throw new Error('initializeRosterSelection not found');
        });

        // Try to actually initialize
        const instance = await initializeRosterSelection({ enableDevPanel: false });
        test('Integration: Full initialization', () => {
          if (!instance.store) throw new Error('No store');
          if (!instance.cinematicController) throw new Error('No cinematicController');
          if (!instance.rerollVFXController) throw new Error('No rerollVFXController');
        });

        results.push(`<div class="pass">✓✓✓ All tests passed! Implementation is working.</div>`);
        results.push(`<div style="margin-top:10px; color: #0ff;">→ Open <a href="./index.html?dev" style="color: #0ff;">index.html?dev</a> to see it in action!</div>`);

      } catch (err) {
        results.push(`<div class="fail">✗ Integration: rosterMain.js - ${err.message}</div>`);
        console.error('Integration error:', err);
      }

      document.getElementById('results').innerHTML = results.join('');
    }

    runTests();
  </script>
</body>
</html>
