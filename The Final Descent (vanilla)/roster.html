<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roster Selection - The Final Descent</title>
  <style>
    :root{
      --bg:#000;
      --ink:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --card:rgba(10,10,16,.34);
      --stroke:rgba(255,255,255,.10);
      --gold:rgba(255,215,0,.95);
      --purple:rgba(157,78,221,.85);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
      overflow:hidden;
    }
    .no-select{user-select:none}

    /* App container */
    #app{position:relative; height:100%; width:100%}

    /* Roster page */
    #roster{
      position:absolute; inset:0;
      background:#000;
      overflow:hidden;
    }

    #space{
      position:absolute; inset:0;
      width:100%; height:100%;
      display:block;
    }

    /* Character cards (Living - large) */
    .character-card {
      position: absolute;
      width: 260px;
      padding: 18px;
      background: rgba(20,20,26,.75);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,215,0,.3);
      border-radius: 14px;
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      pointer-events: none;
      box-shadow: 0 0 40px rgba(255,215,0,.15), 0 20px 60px rgba(0,0,0,.6);
      z-index: 10;
      cursor: pointer;
    }

    .character-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .character-card:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: rgba(255,215,0,.6);
      box-shadow: 0 0 50px rgba(255,215,0,.25), 0 22px 70px rgba(0,0,0,.7);
    }

    .character-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 60px rgba(255,215,0,.4), 0 0 30px rgba(255,215,0,.2) inset;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 60px rgba(255,215,0,.4), 0 0 30px rgba(255,215,0,.2) inset; }
      50% { box-shadow: 0 0 80px rgba(255,215,0,.5), 0 0 40px rgba(255,215,0,.3) inset; }
    }

    /* Fallen plaques (small, purple) */
    .fallen-plaque {
      position: absolute;
      width: 180px;
      padding: 12px;
      background: rgba(15,10,20,.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(157,78,221,.4);
      border-radius: 10px;
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.3s ease;
      pointer-events: none;
      box-shadow: 0 0 30px rgba(157,78,221,.2), 0 15px 50px rgba(0,0,0,.7);
      z-index: 8;
      cursor: pointer;
    }

    .fallen-plaque.show {
      opacity: 0.7;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .fallen-plaque:hover {
      opacity: 1;
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(157,78,221,.7);
      box-shadow: 0 0 40px rgba(157,78,221,.3), 0 17px 55px rgba(0,0,0,.75);
    }

    .fallen-plaque .char-name {
      opacity: 0.6;
    }

    /* Character card content */
    .char-header {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .char-info {
      flex: 1;
    }

    .char-name {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
    }

    .char-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .char-role {
      display: inline-block;
      padding: 3px 9px;
      background: rgba(255,215,0,.12);
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,215,0,.9);
      letter-spacing: 0.03em;
    }

    .fallen-plaque .char-role {
      background: rgba(157,78,221,.12);
      color: rgba(157,78,221,.9);
    }

    /* Small crack pattern overlay for Fallen */
    .fallen-plaque::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(157,78,221,.05) 45%, transparent 50%, rgba(157,78,221,.08) 55%, transparent 60%);
      pointer-events: none;
      border-radius: 10px;
    }

    /* Hover info box */
    .info-box {
      position: absolute;
      top: -10px;
      left: calc(100% + 12px);
      width: 280px;
      padding: 16px;
      background: rgba(10,10,16,.95);
      backdrop-filter: blur(16px);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,.8);
      z-index: 100;
    }

    .character-card:hover .info-box,
    .fallen-plaque:hover .info-box {
      opacity: 1;
      transform: translateX(0);
      pointer-events: all;
    }

    .info-box-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: var(--gold);
    }

    .fallen-plaque .info-box-title {
      color: var(--purple);
    }

    .info-box-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .info-stat {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px;
      background: rgba(255,255,255,.04);
      border-radius: 4px;
      font-size: 12px;
    }

    .info-stat-label {
      color: var(--muted);
    }

    .info-box-quote {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--stroke);
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.5;
    }

    /* Title panel */
    .title-panel {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 15;
    }

    .title-panel.show {
      opacity: 1;
    }

    .title-text {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
    }

    /* Reroll module */
    .reroll-module {
      position: absolute;
      top: 32px;
      right: 32px;
      padding: 12px 16px;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.6s ease 0.2s;
      z-index: 15;
    }

    .reroll-module.show {
      opacity: 1;
    }

    .reroll-label {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .reroll-pips {
      display: flex;
      gap: 6px;
    }

    .reroll-pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,215,0,.3);
      border: 1px solid rgba(255,215,0,.5);
    }

    .reroll-pip.active {
      background: rgba(255,215,0,.9);
      box-shadow: 0 0 8px rgba(255,215,0,.4);
    }

    /* Control panel */
    .control-panel {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px 24px;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.6s ease 0.4s;
      z-index: 20;
    }

    .control-panel.show {
      opacity: 1;
    }

    .control-btn {
      padding: 10px 22px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .control-btn:hover:not(:disabled) {
      background: rgba(255,255,255,.15);
      border-color: rgba(255,255,255,.3);
      transform: translateY(-1px);
    }

    .control-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .control-btn.primary {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .control-btn.primary:hover:not(:disabled) {
      background: rgba(255,215,0,1);
      box-shadow: 0 0 25px rgba(255,215,0,.4);
    }

    /* Blackout overlay */
    .blackout{
      position:absolute; inset:0;
      background:#000;
      opacity:1;
      pointer-events:none;
    }

    /* Vignette */
    .vignette{
      position:absolute; inset:-2px;
      background:radial-gradient(1200px 900px at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.62) 100%);
      pointer-events:none;
      z-index: 5;
    }

    @media (prefers-reduced-motion: reduce){
      .character-card, .fallen-plaque, .control-panel, .title-panel, .reroll-module {
        transition: none;
      }
    }
  </style>
</head>
<body class="no-select">
  <div id="app">
    <section id="roster">
      <canvas id="space" aria-hidden="true"></canvas>

      <!-- Title Panel -->
      <div id="titlePanel" class="title-panel">
        <div class="title-text">Select Your Crew</div>
      </div>

      <!-- Reroll Module -->
      <div id="rerollModule" class="reroll-module">
        <div class="reroll-label">Celestial Rerolls</div>
        <div class="reroll-pips">
          <div class="reroll-pip active" data-pip="0"></div>
          <div class="reroll-pip active" data-pip="1"></div>
          <div class="reroll-pip active" data-pip="2"></div>
        </div>
      </div>

      <!-- Character Cards (generated dynamically) -->
      <div id="character-cards"></div>

      <!-- Control Panel -->
      <div id="controlPanel" class="control-panel">
        <button class="control-btn" id="singleRerollBtn" disabled>
          Single Reroll
        </button>
        <button class="control-btn" id="totalRerollBtn">
          Total Reroll
        </button>
        <button class="control-btn primary" id="confirmBtn" disabled>
          Confirm Selection
        </button>
      </div>

      <div class="vignette"></div>
      <div id="blackout" class="blackout"></div>
    </section>
  </div>

  <script type="module">
    import { GameDB } from './data/database.js';

    // ========================================================================
    // STATE MANAGEMENT
    // ========================================================================

    const state = {
      // Character assignment
      allCharacters: [],
      livingCharacters: [], // 3 random Living
      fallenCharacters: [], // 3 random Fallen

      // Selection
      selectedCharacter: null, // Only one can be selected

      // Rerolls
      rerollsRemaining: 3,

      // Animation state
      animationComplete: false,
      canInteract: false
    };

    // ========================================================================
    // DOM REFERENCES
    // ========================================================================

    const elements = {
      cardsContainer: document.getElementById('character-cards'),
      singleRerollBtn: document.getElementById('singleRerollBtn'),
      totalRerollBtn: document.getElementById('totalRerollBtn'),
      confirmBtn: document.getElementById('confirmBtn'),
      titlePanel: document.getElementById('titlePanel'),
      rerollModule: document.getElementById('rerollModule'),
      controlPanel: document.getElementById('controlPanel'),
    };

    // ========================================================================
    // INITIALIZATION
    // ========================================================================

    function init() {
      // Get all characters and randomly assign
      state.allCharacters = GameDB.getAllCharacters();
      assignLivingAndFallen();

      // The canvas animation will handle showing the cards after the intro
      // We'll call createCharacterCards() from the canvas timeline
    }

    function assignLivingAndFallen() {
      const shuffled = [...state.allCharacters].sort(() => Math.random() - 0.5);
      state.livingCharacters = shuffled.slice(0, 3);
      state.fallenCharacters = shuffled.slice(3, 6);
    }

    // ========================================================================
    // CHARACTER CARDS
    // ========================================================================

    function createCharacterCards() {
      elements.cardsContainer.innerHTML = '';

      // Create Living cards (top 3 positions)
      state.livingCharacters.forEach((char, index) => {
        const card = createLivingCard(char, index);
        elements.cardsContainer.appendChild(card);
      });

      // Create Fallen plaques (bottom 3 positions)
      state.fallenCharacters.forEach((char, index) => {
        const plaque = createFallenPlaque(char, index);
        elements.cardsContainer.appendChild(plaque);
      });

      positionCards();
    }

    function createLivingCard(char, index) {
      const card = document.createElement('div');
      card.className = 'character-card';
      card.dataset.index = index;
      card.dataset.charId = char.id;
      card.dataset.type = 'living';

      card.innerHTML = `
        <div class="char-header">
          <div class="char-info">
            <div class="char-name">${char.name}</div>
            <div class="char-title">${char.title}</div>
            <div class="char-role">${char.specialization}</div>
          </div>
        </div>
        ${createInfoBox(char)}
      `;

      card.addEventListener('click', () => handleLivingCardClick(index));

      return card;
    }

    function createFallenPlaque(char, index) {
      const plaque = document.createElement('div');
      plaque.className = 'fallen-plaque';
      plaque.dataset.index = index;
      plaque.dataset.charId = char.id;
      plaque.dataset.type = 'fallen';

      plaque.innerHTML = `
        <div class="char-header">
          <div class="char-info">
            <div class="char-name">${char.name}</div>
            <div class="char-title">${char.title}</div>
            <div class="char-role">${char.specialization}</div>
          </div>
        </div>
        ${createInfoBox(char)}
      `;

      return plaque;
    }

    function createInfoBox(char) {
      return `
        <div class="info-box">
          <div class="info-box-title">Statistics</div>
          <div class="info-box-stats">
            <div class="info-stat">
              <span class="info-stat-label">HP</span>
              <span>${char.baseHP}</span>
            </div>
            <div class="info-stat">
              <span class="info-stat-label">Defense</span>
              <span>${char.baseDefense}</span>
            </div>
            <div class="info-stat">
              <span class="info-stat-label">Speed</span>
              <span>${char.baseSpeed}</span>
            </div>
            <div class="info-stat">
              <span class="info-stat-label">Damage</span>
              <span>${char.damageModifier}x</span>
            </div>
          </div>
          <div class="info-box-quote">${char.quote}</div>
        </div>
      `;
    }

    function positionCards() {
      const cards = Array.from(elements.cardsContainer.children);

      // Get star positions from canvas if available
      const col = [0.30, 0.50, 0.70];

      // Living cards: top row (centered over Living stars)
      const livingPositions = [
        { x: col[0] * 100, y: 35 },
        { x: col[1] * 100, y: 35 },
        { x: col[2] * 100, y: 35 },
      ];

      // Fallen plaques: bottom row (centered over Fallen stars)
      const fallenPositions = [
        { x: col[0] * 100, y: 70 },
        { x: col[1] * 100, y: 70 },
        { x: col[2] * 100, y: 70 },
      ];

      cards.forEach((card, i) => {
        if (card.dataset.type === 'living') {
          const index = parseInt(card.dataset.index);
          const pos = livingPositions[index];
          card.style.left = `${pos.x}%`;
          card.style.top = `${pos.y}%`;
          card.style.transform = 'translate(-50%, -50%)';
        } else if (card.dataset.type === 'fallen') {
          const index = parseInt(card.dataset.index);
          const pos = fallenPositions[index];
          card.style.left = `${pos.x}%`;
          card.style.top = `${pos.y}%`;
          card.style.transform = 'translate(-50%, -50%)';
        }
      });
    }

    function showCharacterCards() {
      const cards = Array.from(elements.cardsContainer.children);
      cards.forEach((card, i) => {
        setTimeout(() => {
          card.classList.add('show');
        }, i * 80);
      });
    }

    // ========================================================================
    // SELECTION
    // ========================================================================

    function handleLivingCardClick(index) {
      if (!state.canInteract) return;

      // Toggle selection
      if (state.selectedCharacter === index) {
        state.selectedCharacter = null;
      } else {
        state.selectedCharacter = index;

        // Trigger golden burst effect on canvas
        window.triggerGoldenBurst && window.triggerGoldenBurst(index);
      }

      updateSelectionUI();
    }

    function updateSelectionUI() {
      const cards = Array.from(elements.cardsContainer.querySelectorAll('.character-card'));

      cards.forEach((card, i) => {
        if (parseInt(card.dataset.index) === state.selectedCharacter) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });

      // Enable/disable buttons
      elements.singleRerollBtn.disabled = state.selectedCharacter === null;
      elements.confirmBtn.disabled = state.selectedCharacter === null;
    }

    // ========================================================================
    // REROLL LOGIC
    // ========================================================================

    function performSingleReroll() {
      if (!state.canInteract || state.selectedCharacter === null || state.rerollsRemaining === 0) return;

      // Get the two Living characters to keep
      const keepIndices = [0, 1, 2].filter(i => i !== state.selectedCharacter);
      const keepCharacters = keepIndices.map(i => state.livingCharacters[i]);
      const keepIds = keepCharacters.map(c => c.id);

      // Get a new random character (excluding Living + Fallen)
      const excludeIds = [...state.livingCharacters, ...state.fallenCharacters].map(c => c.id);
      const available = state.allCharacters.filter(c => !excludeIds.includes(c.id));

      // If no available characters, swap with a Fallen character
      let newChar;
      if (available.length > 0) {
        newChar = available[Math.floor(Math.random() * available.length)];
      } else {
        // Swap with a random Fallen
        const randomFallenIndex = Math.floor(Math.random() * state.fallenCharacters.length);
        newChar = state.fallenCharacters[randomFallenIndex];

        // Replace that Fallen with the old Living
        state.fallenCharacters[randomFallenIndex] = state.livingCharacters[state.selectedCharacter];
      }

      // Replace the selected Living character
      state.livingCharacters[state.selectedCharacter] = newChar;
      state.rerollsRemaining--;
      state.selectedCharacter = null;

      // Update UI
      fadeOutAndRecreate();
      updateRerollPips();
    }

    function performTotalReroll() {
      if (!state.canInteract || state.rerollsRemaining === 0) return;

      state.rerollsRemaining--;
      state.selectedCharacter = null;

      // Trigger crumble animation, then restart from 6-stars phase
      window.triggerTotalReroll && window.triggerTotalReroll();

      updateRerollPips();
    }

    function fadeOutAndRecreate() {
      const cards = Array.from(elements.cardsContainer.children);
      cards.forEach(card => card.classList.remove('show'));

      setTimeout(() => {
        createCharacterCards();
        setTimeout(() => showCharacterCards(), 50);
        updateSelectionUI();
      }, 500);
    }

    function updateRerollPips() {
      const pips = document.querySelectorAll('.reroll-pip');
      pips.forEach((pip, i) => {
        if (i < state.rerollsRemaining) {
          pip.classList.add('active');
        } else {
          pip.classList.remove('active');
        }
      });

      elements.singleRerollBtn.disabled = state.rerollsRemaining === 0;
      elements.totalRerollBtn.disabled = state.rerollsRemaining === 0;
    }

    // ========================================================================
    // CONFIRMATION
    // ========================================================================

    function confirmSelection() {
      if (!state.canInteract || state.selectedCharacter === null) return;

      const selectedChar = state.livingCharacters[state.selectedCharacter];
      const crew = [selectedChar];

      // Save to localStorage
      localStorage.setItem('selectedCrew', JSON.stringify(crew.map(c => c.id)));

      console.log('Crew selected:', crew);

      alert(`Selected: ${selectedChar.name}\n\n(Next: Navigate to game UI)`);
    }

    // ========================================================================
    // EVENT LISTENERS
    // ========================================================================

    elements.singleRerollBtn.addEventListener('click', performSingleReroll);
    elements.totalRerollBtn.addEventListener('click', performTotalReroll);
    elements.confirmBtn.addEventListener('click', confirmSelection);

    // ========================================================================
    // START
    // ========================================================================

    init();

    // Make state accessible for canvas animation
    window.rosterState = state;
    window.rosterElements = elements;
    window.createCharacterCards = createCharacterCards;
    window.showCharacterCards = showCharacterCards;
    window.updateSelectionUI = updateSelectionUI;
  </script>

  <!-- Starfield & Animation -->
  <script>
    (function(){
      "use strict";

      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const blackout = document.getElementById('blackout');
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let stars = [];
      let sprites = [];
      let rafId = null;
      let startTime = 0;
      let specialIdx = [];
      let specialChosen = false;
      let burstTriggered = false;
      let W = 0, H = 0, DPR = 1;

      // Particle systems for bursts
      let particleSystems = [];
      let selectionBurstActive = false;
      let selectionBurstIndex = -1;
      let selectionBurstStartTime = 0;

      const TIMINGS = {
        blackHold: 875,
        bgFade: 525,
        twinkleRamp: 1750,
        specialFlicker: 1050,
        burst: 400,
        arrange: 2800,
        syncPulse: 300,          // NEW: Synchronized pulse when settled
        sweepWave: 400,          // NEW: Selection sweep wave
        fallenMark: 900,         // NEW: Mark 3 as Fallen (stutter + cracks + dim)
        positioning: 1200,       // NEW: Living high, Fallen low
        morphToCards: 1400,      // NEW: Stars morph to cards
        uiFadeIn: 600,           // NEW: UI elements appear
      };

      function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
      function lerp(a,b,t){ return a + (b-a)*t; }
      function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }
      function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }
      function easeInCubic(t){ return t*t*t; }

      function mulberry32(seed){
        let a = seed >>> 0;
        return function(){
          a |= 0;
          a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---- Particle burst system ----
      const PARTICLE_OPTS = {
        particles: 50,
        baseSize: 1.5,
        addedSize: 2.5,
        baseTime: 20,
        addedTime: 15,
        baseRandom: 1,
        addedRandom: 3,
        radius: 70,
        baseAlpha: 0.85,
        addedAlpha: 0.15,
      };

      function Particle(centerX, centerY){
        this.cx = centerX;
        this.cy = centerY;
        this.reset();
      }

      Particle.prototype.reset = function(){
        const radian = Math.random() * Math.PI * 2;
        const radius = Math.random() * PARTICLE_OPTS.radius;

        this.time = (PARTICLE_OPTS.baseTime + PARTICLE_OPTS.addedTime * Math.random()) | 0;
        this.tick = 0;

        this.size = (PARTICLE_OPTS.baseSize + PARTICLE_OPTS.addedSize * Math.random()) | 0;

        this.dx = (Math.cos(radian) * radius) | 0;
        this.dy = (Math.sin(radian) * radius) | 0;

        this.px = 0;
        this.py = 0;
        this.alpha = 0;
        this.dead = false;
      };

      Particle.prototype.step = function(){
        if (this.dead) return;

        ++this.tick;

        const proportion = this.tick / this.time;
        const armonic = -Math.cos(proportion * Math.PI / 2) + 1;
        const variation = PARTICLE_OPTS.baseRandom + PARTICLE_OPTS.addedRandom * Math.random();
        const x = this.dx * armonic + (Math.random() - 0.5) * variation * 2 | 0;
        const y = this.dy * armonic + (Math.random() - 0.5) * variation * 2 | 0;

        const alphaFade = 1 - proportion;
        this.alpha = (PARTICLE_OPTS.baseAlpha + PARTICLE_OPTS.addedAlpha * Math.random()) * alphaFade;

        this.currentX = x;
        this.currentY = y;
        this.currentSize = this.size;

        if(proportion >= 1)
          this.dead = true;
      };

      function initParticleSystems(){
        const minDim = Math.min(W, H);
        PARTICLE_OPTS.radius = minDim * 0.08;

        particleSystems = [];
        for(let i = 0; i < 6; i++){
          const particles = [];
          for(let j = 0; j < PARTICLE_OPTS.particles; j++){
            particles.push(new Particle(0, 0));
          }
          particleSystems.push({ particles });
        }
      }

      function updateAndDrawParticles(specialPositions, intensity){
        if(particleSystems.length === 0) return;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        for(let i = 0; i < Math.min(specialPositions.length, particleSystems.length); i++){
          const pos = specialPositions[i];
          if(!pos) continue;

          const system = particleSystems[i];

          for(let j = 0; j < system.particles.length; j++){
            const p = system.particles[j];
            if(p.dead) continue;

            p.cx = pos.x;
            p.cy = pos.y;

            p.step();

            const alpha = p.alpha * intensity;
            if(alpha > 0.01){
              ctx.strokeStyle = `hsla(45, 100%, 60%, ${alpha})`;
              ctx.lineWidth = p.currentSize;
              ctx.beginPath();
              ctx.moveTo(p.cx + p.px, p.cy + p.py);
              ctx.lineTo(p.cx + p.currentX, p.cy + p.currentY);
              ctx.stroke();
            }

            p.px = p.currentX;
            p.py = p.currentY;
          }
        }

        ctx.restore();
      }

      function resize(){
        const rect = canvas.getBoundingClientRect();
        DPR = clamp(window.devicePixelRatio || 1, 1, 2);
        W = Math.max(1, Math.floor(rect.width));
        H = Math.max(1, Math.floor(rect.height));
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function makeStarSprite(baseR){
        const pad = Math.ceil(baseR * 6);
        const size = pad * 2;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const g = c.getContext('2d');
        const cx = pad, cy = pad;

        let grd = g.createRadialGradient(cx, cy, 0, cx, cy, pad);
        grd.addColorStop(0.00, 'rgba(255,255,255,0.80)');
        grd.addColorStop(0.12, 'rgba(255,255,255,0.55)');
        grd.addColorStop(0.32, 'rgba(200,220,255,0.20)');
        grd.addColorStop(1.00, 'rgba(0,0,0,0.0)');
        g.fillStyle = grd;
        g.fillRect(0,0,size,size);

        grd = g.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.6);
        grd.addColorStop(0.00, 'rgba(255,255,255,1.00)');
        grd.addColorStop(0.50, 'rgba(255,255,255,0.75)');
        grd.addColorStop(1.00, 'rgba(255,255,255,0.00)');
        g.fillStyle = grd;
        g.beginPath();
        g.arc(cx, cy, baseR * 1.6, 0, Math.PI*2);
        g.fill();

        return { canvas:c, baseR, size };
      }

      function buildSprites(){
        sprites = [
          makeStarSprite(0.55),
          makeStarSprite(0.85),
          makeStarSprite(1.20),
          makeStarSprite(1.70),
        ];
      }

      function pickSpriteIdx(r){
        if (r < 0.7) return 0;
        if (r < 1.0) return 1;
        if (r < 1.4) return 2;
        return 3;
      }

      function buildStars(count){
        stars = new Array(count);
        for (let i=0; i<count; i++){
          const nx = Math.random();
          const ny = Math.pow(Math.random(), 0.78);

          const u = Math.random();
          const r = (u < 0.86) ? lerp(0.35, 0.95, Math.random()) :
                    (u < 0.98) ? lerp(0.95, 1.55, Math.random()) :
                                 lerp(1.55, 2.25, Math.random());

          const a = clamp(lerp(0.10, 0.95, Math.pow(Math.random(), 0.58)), 0.06, 0.98);

          const twAmp = lerp(0.08, 0.38, Math.random());
          const twSpd = lerp(0.35, 1.85, Math.random());
          const twPh = Math.random() * Math.PI * 2;
          const seed = (Math.random() * 1e9) | 0;
          const spriteIdx = pickSpriteIdx(r);

          stars[i] = { nx, ny, r, a, twAmp, twSpd, twPh, seed, spriteIdx };
        }
      }

      function chooseSpecialStars(){
        if (specialChosen) return;
        specialChosen = true;

        const picks = new Set();
        while (picks.size < 6) picks.add((Math.random() * stars.length) | 0);
        specialIdx = Array.from(picks);

        for (let k=0; k<specialIdx.length; k++){
          const s = stars[specialIdx[k]];
          s.special = true;
          s.sx0 = s.nx;
          s.sy0 = s.ny;
          // Don't mark as Fallen yet - all stars start identical
          s.isFallen = false;
          s.fallenIndex = k; // Store which ones will become Fallen later
        }

        initParticleSystems();
      }

      function computeTargets(){
        const col = [0.30, 0.50, 0.70];
        const rowLiving = 0.42;
        const rowFallen = 0.63;
        const targets = [];

        // First 3: Living (top row)
        for (let c=0; c<3; c++){
          targets.push({ nx: col[c], ny: rowLiving, isFallen: false });
        }

        // Last 3: Fallen (bottom row)
        for (let c=0; c<3; c++){
          targets.push({ nx: col[c], ny: rowFallen, isFallen: true });
        }

        return targets;
      }

      function drawBackground(bgOpacity){
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,W,H);

        if (bgOpacity <= 0) return;

        const gx = W * 0.5;
        const gy = H * 1.06;
        const radius = Math.max(W, H) * 1.05;
        const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, radius);
        grd.addColorStop(0.00, `rgba(170, 90, 255, ${0.55 * bgOpacity})`);
        grd.addColorStop(0.18, `rgba(120, 40, 235, ${0.30 * bgOpacity})`);
        grd.addColorStop(0.42, `rgba(60, 10, 130, ${0.16 * bgOpacity})`);
        grd.addColorStop(0.72, `rgba(10, 8, 20, ${0.08 * bgOpacity})`);
        grd.addColorStop(1.00, `rgba(0, 0, 0, 0)`);
        ctx.fillStyle = grd;
        ctx.fillRect(0,0,W,H);

        const v = ctx.createLinearGradient(0,0,0,H);
        v.addColorStop(0.0, `rgba(0,0,0,${0.75 * (1-bgOpacity)})`);
        v.addColorStop(0.35, 'rgba(0,0,0,0)');
        v.addColorStop(1.0, `rgba(0,0,0,0)`);
        ctx.fillStyle = v;
        ctx.fillRect(0,0,W,H);
      }

      function drawStarSprite(x, y, r, alpha, spriteIdx){
        const spr = sprites[spriteIdx];
        const scale = r / spr.baseR;
        const size = spr.size * scale;
        ctx.globalAlpha = alpha;
        ctx.drawImage(spr.canvas, x - size/2, y - size/2, size, size);
      }

      function drawSpecialStar(x, y, r, alpha, energy, tNow, seed, isFallen, fallenMix){
        ctx.save();
        ctx.globalAlpha = 1;

        // Choose color based on Living/Fallen status
        const hue = isFallen ? 270 : 45; // Purple for Fallen, Gold for Living
        const sat = isFallen ? 60 : 100;
        const light = isFallen ? 50 : 60;

        // Dimming for Fallen
        const dimFactor = isFallen ? lerp(1, 0.4, fallenMix) : 1;

        ctx.globalCompositeOperation = 'lighter';
        const haloR = r * lerp(1.7, 2.15, energy);
        let grd = ctx.createRadialGradient(x, y, 0, x, y, haloR);
        grd.addColorStop(0.00, `hsla(${hue}, ${sat}%, ${light}%, ${0.60 * energy * dimFactor})`);
        grd.addColorStop(0.12, `hsla(${hue}, ${sat}%, ${light-5}%, ${0.48 * energy * dimFactor})`);
        grd.addColorStop(0.35, `hsla(${hue}, ${sat}%, ${light-10}%, ${0.22 * energy * dimFactor})`);
        grd.addColorStop(1.00, `rgba(0, 0, 0, 0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(x, y, haloR, 0, Math.PI*2);
        ctx.fill();

        grd = ctx.createRadialGradient(x, y, 0, x, y, r * 1.35);
        grd.addColorStop(0.00, `hsla(${hue}, ${sat}%, 95%, ${0.90 * alpha * dimFactor})`);
        grd.addColorStop(0.20, `hsla(${hue}, ${sat}%, 85%, ${0.78 * alpha * dimFactor})`);
        grd.addColorStop(0.55, `hsla(${hue}, ${sat}%, 70%, ${0.34 * alpha * dimFactor})`);
        grd.addColorStop(1.00, `rgba(0,0,0,0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(x, y, r * 1.35, 0, Math.PI*2);
        ctx.fill();

        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = clamp(alpha * dimFactor + 0.25, 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.beginPath();
        ctx.arc(x, y, Math.max(1.2, r * 0.28), 0, Math.PI*2);
        ctx.fill();

        // Draw cracks for Fallen
        if (isFallen && fallenMix > 0.3) {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = fallenMix * 0.5;
          ctx.strokeStyle = `hsla(${hue}, ${sat}%, 30%, 0.6)`;
          ctx.lineWidth = Math.max(0.5, r * 0.015);

          const rand = mulberry32(seed);
          for (let i = 0; i < 5; i++) {
            const angle = rand() * Math.PI * 2;
            const length = r * (0.5 + rand() * 0.8);
            const startR = r * 0.3;
            const wobble = (rand() - 0.5) * r * 0.15;

            ctx.beginPath();
            ctx.moveTo(x + Math.cos(angle) * startR, y + Math.sin(angle) * startR);
            ctx.lineTo(x + Math.cos(angle) * length + wobble, y + Math.sin(angle) * length + wobble);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function frame(now){
        const t = now - startTime;

        const tBlackEnd = TIMINGS.blackHold;
        const tBgEnd = tBlackEnd + TIMINGS.bgFade;
        const tTwinkleEnd = tBgEnd + TIMINGS.twinkleRamp;
        const tFlickerEnd = tTwinkleEnd + TIMINGS.specialFlicker;
        const tBurstEnd = tFlickerEnd + TIMINGS.burst;
        const tArrangeEnd = tBurstEnd + TIMINGS.arrange;
        const tSyncPulseEnd = tArrangeEnd + TIMINGS.syncPulse;
        const tSweepEnd = tSyncPulseEnd + TIMINGS.sweepWave;
        const tFallenMarkEnd = tSweepEnd + TIMINGS.fallenMark;
        const tPositioningEnd = tFallenMarkEnd + TIMINGS.positioning;
        const tMorphEnd = tPositioningEnd + TIMINGS.morphToCards;
        const tUIFadeEnd = tMorphEnd + TIMINGS.uiFadeIn;

        const bgOpacity = prefersReduced ? 1 : clamp((t - tBlackEnd) / TIMINGS.bgFade, 0, 1);
        const twinkleMix = prefersReduced ? 1 : clamp((t - tBgEnd) / TIMINGS.twinkleRamp, 0, 1);

        if (!specialChosen && (prefersReduced || t >= tTwinkleEnd)) chooseSpecialStars();

        const flickerMix = prefersReduced ? 1 : clamp((t - tTwinkleEnd) / TIMINGS.specialFlicker, 0, 1);
        const flickerEase = easeOutCubic(flickerMix);

        const burstMix = prefersReduced ? 1 : clamp((t - tFlickerEnd) / TIMINGS.burst, 0, 1);
        const arrangeMix = prefersReduced ? 1 : clamp((t - tBurstEnd) / TIMINGS.arrange, 0, 1);
        const arrangeEase = easeInOutCubic(arrangeMix);

        // NEW animation phases
        const syncPulseMix = prefersReduced ? 1 : clamp((t - tArrangeEnd) / TIMINGS.syncPulse, 0, 1);
        const sweepMix = prefersReduced ? 1 : clamp((t - tSyncPulseEnd) / TIMINGS.sweepWave, 0, 1);
        const fallenMarkMix = prefersReduced ? 1 : clamp((t - tSweepEnd) / TIMINGS.fallenMark, 0, 1);
        const fallenMarkEase = easeOutCubic(fallenMarkMix);

        // Synchronized pulse: all stars bloom at end of arrange
        const pulseAmount = syncPulseMix < 0.5
          ? easeOutCubic(syncPulseMix * 2) // bloom out
          : easeInCubic((1 - syncPulseMix) * 2); // return to normal

        // Mark stars as Fallen during the fallenMark phase
        if (specialChosen && fallenMarkMix > 0 && fallenMarkMix < 1) {
          for (let k=0; k<specialIdx.length; k++){
            const s = stars[specialIdx[k]];
            if (s.fallenIndex >= 3 && !s.isFallen) {
              s.isFallen = true; // Transition starts
            }
          }
        }

        const positioningMix = prefersReduced ? 1 : clamp((t - tFallenMarkEnd) / TIMINGS.positioning, 0, 1);
        const positioningEase = easeInOutCubic(positioningMix);

        const morphMix = prefersReduced ? 1 : clamp((t - tPositioningEnd) / TIMINGS.morphToCards, 0, 1);
        const morphEase = easeInOutCubic(morphMix);

        const uiFadeMix = prefersReduced ? 1 : clamp((t - tMorphEnd) / TIMINGS.uiFadeIn, 0, 1);

        // Show character cards when morphing begins
        if (morphMix > 0.1 && window.rosterState && !window.rosterState.animationComplete) {
          window.createCharacterCards && window.createCharacterCards();
          window.showCharacterCards && window.showCharacterCards();
        }

        // Show UI elements in sequence
        if (window.rosterElements) {
          if (uiFadeMix > 0) {
            window.rosterElements.titlePanel.classList.add('show');
          }
          if (uiFadeMix > 0.3) {
            window.rosterElements.rerollModule.classList.add('show');
          }
          if (uiFadeMix > 0.6) {
            window.rosterElements.controlPanel.classList.add('show');
          }
        }

        // Enable interaction when fully complete
        if (uiFadeMix >= 1 && window.rosterState && !window.rosterState.canInteract) {
          window.rosterState.canInteract = true;
          window.rosterState.animationComplete = true;
        }

        drawBackground(bgOpacity);

        const minDim = Math.min(W, H);
        const specialTargetR = minDim * 0.04;
        const targets = computeTargets();

        // Compute special star positions with new positioning phase
        const specialPos = new Map();
        for (let i=0; i<specialIdx.length; i++){
          const s = stars[specialIdx[i]];
          // Determine which target based on fallenIndex
          const targetIndex = s.fallenIndex;
          const target = targets[targetIndex];
          const ox = s.nx * W;
          const oy = s.ny * H;

          // Arrange phase: all 6 move to 2x3 grid (top 3 at row 0.42, bottom 3 at row 0.63)
          // This creates "two neat rows of three" while all still golden
          const arrangeTargetY = (s.fallenIndex < 3) ? 0.42 : 0.63;
          const arrangedX = lerp(ox, target.nx * W, arrangeEase);
          const arrangedY = lerp(oy, arrangeTargetY * H, arrangeEase);

          // Positioning phase: Living move to top row, Fallen move to bottom row
          // (This rearranges them so Living=top, Fallen=bottom regardless of initial position)
          const finalTargetY = s.isFallen ? 0.70 : 0.35;
          const finalY = lerp(arrangedY, finalTargetY * H, positioningEase);

          const x = arrangedX;
          const y = finalY;
          const r = lerp(s.r, specialTargetR, arrangeEase);

          specialPos.set(specialIdx[i], { x, y, r, ox, oy, tx: target.nx * W, ty: target.ny * H });
        }

        // Draw far stars
        ctx.globalCompositeOperation = 'source-over';
        for (let i=0; i<stars.length; i++){
          const s = stars[i];
          if (s.special) continue;
          const x = s.nx * W;
          const y = s.ny * H;
          const tw = Math.sin(s.twPh + (now * 0.001) * s.twSpd * 2.0);
          const a = clamp(s.a * (1 + twinkleMix * s.twAmp * tw), 0.02, 1);
          const r = s.r * (1 + twinkleMix * 0.08 * tw);
          drawStarSprite(x, y, r, a, s.spriteIdx);
        }

        // Draw particle bursts during burst phase
        if (specialChosen && t >= tFlickerEnd && t < tBurstEnd) {
          if (!burstTriggered) {
            burstTriggered = true;
            for (let i = 0; i < particleSystems.length; i++) {
              for (let j = 0; j < particleSystems[i].particles.length; j++) {
                particleSystems[i].particles[j].reset();
              }
            }
          }

          const specialPositions = [];
          for (let i=0; i<specialIdx.length; i++){
            const p = specialPos.get(specialIdx[i]);
            if (p) specialPositions.push(p);
          }
          updateAndDrawParticles(specialPositions, 1.0);
        }

        // Draw selection burst if active
        if (selectionBurstActive) {
          const burstAge = now - selectionBurstStartTime;
          const burstDuration = 600;

          if (burstAge < burstDuration) {
            const burstProgress = burstAge / burstDuration;
            const burstIntensity = 1 - burstProgress;

            const system = particleSystems[selectionBurstIndex];
            const pos = specialPos.get(specialIdx[selectionBurstIndex]);

            if (system && pos) {
              ctx.save();
              ctx.globalCompositeOperation = 'lighter';

              for (let j = 0; j < system.particles.length; j++) {
                const p = system.particles[j];
                if (p.dead) continue;

                p.cx = pos.x;
                p.cy = pos.y;
                p.step();

                const alpha = p.alpha * burstIntensity;
                if (alpha > 0.01) {
                  ctx.strokeStyle = `hsla(45, 100%, 65%, ${alpha})`;
                  ctx.lineWidth = p.currentSize;
                  ctx.beginPath();
                  ctx.moveTo(p.cx + p.px, p.cy + p.py);
                  ctx.lineTo(p.cx + p.currentX, p.cy + p.currentY);
                  ctx.stroke();
                }

                p.px = p.currentX;
                p.py = p.currentY;
              }

              ctx.restore();
            }
          } else {
            selectionBurstActive = false;
          }
        }

        // Draw special stars
        for (let i=0; i<specialIdx.length; i++){
          const idx = specialIdx[i];
          const s = stars[idx];
          const p = specialPos.get(idx);
          if (!p) continue;

          const tw = Math.sin(s.twPh + (now * 0.001) * s.twSpd * 1.6);
          const baseA = clamp(s.a * (1 + twinkleMix * 0.22 * tw), 0.08, 1);

          const energyOsc = 0.55 + 0.45 * Math.sin((now * 0.001) * (9.5 + (s.seed % 7)) + s.twPh);
          const energy = clamp((flickerEase * 0.95 + arrangeEase * 0.75) * energyOsc, 0, 1);

          const breathe = 1 + 0.03 * energy * Math.sin((now * 0.001) * 4.0 + s.twPh);

          // Synchronized pulse effect
          const pulseMult = 1 + pulseAmount * 0.25; // 25% size increase during pulse
          const pulseAlpha = 1 + pulseAmount * 0.4; // 40% brightness increase

          // Selection sweep effect
          const sweepProgress = sweepMix;
          const starXNorm = (p.x / W); // normalized X position
          const sweepAtStar = clamp((sweepProgress - starXNorm + 0.1) * 10, 0, 1); // wave hits this star
          const sweepRimTighten = sweepAtStar > 0 && sweepAtStar < 1 ? Math.sin(sweepAtStar * Math.PI) * 0.3 : 0;

          // Stutter effect for Fallen stars during marking
          let stutterX = 0, stutterY = 0;
          if (s.isFallen && fallenMarkMix < 0.4) {
            const rand = mulberry32(s.seed + Math.floor(now / 50));
            stutterX = (rand() - 0.5) * p.r * 0.15;
            stutterY = (rand() - 0.5) * p.r * 0.15;
          }

          const rr = p.r * breathe * pulseMult;
          const finalX = p.x + stutterX;
          const finalY = p.y + stutterY;
          const finalAlpha = baseA * pulseAlpha * (1 + sweepRimTighten);

          // Fade out stars as cards appear
          const starOpacity = 1 - morphMix * 0.7;

          // Draw falling ash for Fallen stars during marking
          if (s.isFallen && fallenMarkMix > 0.1 && fallenMarkMix < 0.6) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = (0.6 - fallenMarkMix) * 1.5;
            const ashCount = 8;
            const rand = mulberry32(s.seed);
            for (let a = 0; a < ashCount; a++) {
              const ashX = finalX + (rand() - 0.5) * p.r * 0.5;
              const ashY = finalY + p.r * 0.5 + fallenMarkMix * p.r * 3;
              const ashSize = rand() * 1.5 + 0.5;
              ctx.fillStyle = `rgba(200, 180, 255, ${rand() * 0.4})`;
              ctx.fillRect(ashX, ashY, ashSize, ashSize);
            }
            ctx.restore();
          }

          ctx.globalAlpha = starOpacity;
          drawSpecialStar(finalX, finalY, rr, finalAlpha, energy, now, s.seed, s.isFallen, fallenMarkEase);

          ctx.globalCompositeOperation = 'lighter';
          drawStarSprite(finalX, finalY, Math.max(1.6, rr * 0.22), clamp(0.55 + 0.45*energy, 0, 1) * starOpacity, 2);
          ctx.globalCompositeOperation = 'source-over';
        }

        rafId = requestAnimationFrame(frame);
      }

      function startRosterSlice(){
        if (rafId) cancelAnimationFrame(rafId);

        resize();
        buildSprites();
        buildStars(3000);
        specialIdx = [];
        specialChosen = false;
        burstTriggered = false;
        particleSystems = [];

        // Reset UI (only if elements are loaded)
        if (window.rosterElements) {
          window.rosterElements.titlePanel.classList.remove('show');
          window.rosterElements.rerollModule.classList.remove('show');
          window.rosterElements.controlPanel.classList.remove('show');
        }

        blackout.style.transition = 'none';
        blackout.style.opacity = '1';
        blackout.style.display = 'block';

        blackout.getBoundingClientRect();

        if (prefersReduced){
          blackout.style.opacity = '0';
        } else {
          setTimeout(() => {
            blackout.style.transition = 'opacity 210ms linear';
            blackout.style.opacity = '0';
          }, TIMINGS.blackHold);
        }

        setTimeout(() => {
          blackout.style.display = 'none';
        }, prefersReduced ? 10 : (TIMINGS.blackHold + 280));

        startTime = performance.now();
        rafId = requestAnimationFrame(frame);
      }

      // Trigger golden burst on selection
      window.triggerGoldenBurst = function(index) {
        if (index < 0 || index >= 3) return;

        selectionBurstIndex = index;
        selectionBurstStartTime = performance.now();
        selectionBurstActive = true;

        // Reset particles for this star
        const system = particleSystems[index];
        if (system) {
          for (let j = 0; j < system.particles.length; j++) {
            system.particles[j].reset();
          }
        }
      };

      // Trigger total reroll (crumble and restart)
      window.triggerTotalReroll = function() {
        // Fade out character cards
        const cards = Array.from(window.rosterElements.cardsContainer.children);
        cards.forEach(card => card.classList.remove('show'));

        // Reassign Living/Fallen
        setTimeout(() => {
          const shuffled = [...window.rosterState.allCharacters].sort(() => Math.random() - 0.5);
          window.rosterState.livingCharacters = shuffled.slice(0, 3);
          window.rosterState.fallenCharacters = shuffled.slice(3, 6);

          // Restart animation from stars phase
          startRosterSlice();
        }, 600);
      };

      window.addEventListener('resize', () => {
        resize();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') {
          startRosterSlice();
        }
      });

      startRosterSlice();
    })();
  </script>
</body>
</html>
