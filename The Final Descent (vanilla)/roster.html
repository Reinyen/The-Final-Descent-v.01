<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roster Selection - The Final Descent</title>
  <style>
    :root{
      --bg:#000;
      --ink:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --card:rgba(10,10,16,.34);
      --stroke:rgba(255,255,255,.10);
      --gold:rgba(255,215,0,.95);
      --purple:rgba(157,78,221,.85);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
      overflow:hidden;
    }
    .no-select{user-select:none}

    /* App container */
    #app{position:relative; height:100%; width:100%}

    /* Roster page */
    #roster{
      position:absolute; inset:0;
      background:#000;
      overflow:hidden;
    }

    #space{
      position:absolute; inset:0;
      width:100%; height:100%;
      display:block;
    }

    /* Character cards (Living - large) */
    .character-card {
      position: absolute;
      width: 260px;
      padding: 18px;
      background: rgba(20,20,26,.75);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,215,0,.3);
      border-radius: 14px;
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      pointer-events: none;
      box-shadow: 0 0 40px rgba(255,215,0,.15), 0 20px 60px rgba(0,0,0,.6);
      z-index: 10;
      cursor: pointer;
    }

    .character-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .character-card:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: rgba(255,215,0,.6);
      box-shadow: 0 0 50px rgba(255,215,0,.25), 0 22px 70px rgba(0,0,0,.7);
    }

    .character-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 60px rgba(255,215,0,.4), 0 0 30px rgba(255,215,0,.2) inset;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 60px rgba(255,215,0,.4), 0 0 30px rgba(255,215,0,.2) inset; }
      50% { box-shadow: 0 0 80px rgba(255,215,0,.5), 0 0 40px rgba(255,215,0,.3) inset; }
    }

    /* Fallen plaques (small, purple) */
    .fallen-plaque {
      position: absolute;
      width: 180px;
      padding: 12px;
      background: rgba(15,10,20,.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(157,78,221,.4);
      border-radius: 10px;
      opacity: 0;
      transform: translateY(-8px) scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.3s ease;
      pointer-events: none;
      box-shadow: 0 0 30px rgba(157,78,221,.2), 0 15px 50px rgba(0,0,0,.7);
      z-index: 8;
      cursor: pointer;
    }

    .fallen-plaque.show {
      opacity: 0.7;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .fallen-plaque:hover {
      opacity: 1;
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(157,78,221,.7);
      box-shadow: 0 0 40px rgba(157,78,221,.3), 0 17px 55px rgba(0,0,0,.75);
    }

    .fallen-plaque .char-name {
      opacity: 0.6;
    }

    /* Character card content */
    .char-header {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .char-info {
      flex: 1;
    }

    .char-name {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
    }

    .char-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .char-role {
      display: inline-block;
      padding: 3px 9px;
      background: rgba(255,215,0,.12);
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,215,0,.9);
      letter-spacing: 0.03em;
    }

    .fallen-plaque .char-role {
      background: rgba(157,78,221,.12);
      color: rgba(157,78,221,.9);
    }

    /* Small crack pattern overlay for Fallen */
    .fallen-plaque::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(157,78,221,.05) 45%, transparent 50%, rgba(157,78,221,.08) 55%, transparent 60%);
      pointer-events: none;
      border-radius: 10px;
    }

    /* Hover info box */
    .info-box {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 320px;
      padding: 16px;
      background: rgba(10,10,16,.98);
      backdrop-filter: blur(16px);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.95);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,.9);
      z-index: 1000;
    }

    .character-card:hover .info-box,
    .fallen-plaque:hover .info-box {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: all;
    }

    .info-box-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: var(--gold);
    }

    .fallen-plaque .info-box-title {
      color: var(--purple);
    }

    .info-box-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .info-stat {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px;
      background: rgba(255,255,255,.04);
      border-radius: 4px;
      font-size: 12px;
    }

    .info-stat-label {
      color: var(--muted);
    }

    .info-box-quote {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--stroke);
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.5;
    }

    /* Title panel */
    .title-panel {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 15;
    }

    .title-panel.show {
      opacity: 1;
    }

    .title-text {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
    }

    /* Reroll module */
    .reroll-module {
      position: absolute;
      top: 32px;
      right: 32px;
      padding: 12px 16px;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--stroke);
      border-radius: 10px;
      opacity: 0;
      transition: opacity 0.6s ease 0.2s;
      z-index: 15;
    }

    .reroll-module.show {
      opacity: 1;
    }

    .reroll-label {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .reroll-pips {
      display: flex;
      gap: 6px;
    }

    .reroll-pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,215,0,.3);
      border: 1px solid rgba(255,215,0,.5);
    }

    .reroll-pip.active {
      background: rgba(255,215,0,.9);
      box-shadow: 0 0 8px rgba(255,215,0,.4);
    }

    /* Control panel */
    .control-panel {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px 24px;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.6s ease 0.4s;
      z-index: 20;
    }

    .control-panel.show {
      opacity: 1;
    }

    .control-btn {
      padding: 10px 22px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .control-btn:hover:not(:disabled) {
      background: rgba(255,255,255,.15);
      border-color: rgba(255,255,255,.3);
      transform: translateY(-1px);
    }

    .control-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .control-btn.primary {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .control-btn.primary:hover:not(:disabled) {
      background: rgba(255,215,0,1);
      box-shadow: 0 0 25px rgba(255,215,0,.4);
    }

    /* Blackout overlay */
    .blackout{
      position:absolute; inset:0;
      background:#000;
      opacity:1;
      pointer-events:none;
    }

    /* Vignette */
    .vignette{
      position:absolute; inset:-2px;
      background:radial-gradient(1200px 900px at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.62) 100%);
      pointer-events:none;
      z-index: 5;
    }

    /* Crumble animation */
    @keyframes crumble {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(0.9) rotate(2deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5) translateY(20px);
      }
    }

    .character-card.crumbling,
    .fallen-plaque.crumbling {
      animation: crumble 1s ease-out forwards;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce){
      .character-card, .fallen-plaque, .control-panel, .title-panel, .reroll-module {
        transition: none;
      }
    }
  </style>
</head>
<body class="no-select">
  <div id="app">
    <section id="roster">
      <canvas id="space" aria-hidden="true"></canvas>

      <!-- Title Panel -->
      <div id="titlePanel" class="title-panel">
        <div class="title-text">Select Your Crew</div>
      </div>

      <!-- Reroll Module -->
      <div id="rerollModule" class="reroll-module">
        <div class="reroll-label">Celestial Rerolls</div>
        <div class="reroll-pips">
          <div class="reroll-pip active" data-pip="0"></div>
          <div class="reroll-pip active" data-pip="1"></div>
          <div class="reroll-pip active" data-pip="2"></div>
        </div>
      </div>

      <!-- Character Cards (generated dynamically) -->
      <div id="character-cards"></div>

      <!-- Control Panel -->
      <div id="controlPanel" class="control-panel">
        <button class="control-btn" id="singleRerollBtn" disabled>
          Single Reroll
        </button>
        <button class="control-btn" id="totalRerollBtn">
          Total Reroll
        </button>
        <button class="control-btn primary" id="confirmBtn" disabled>
          Confirm Selection
        </button>
      </div>

      <div class="vignette"></div>
      <div id="blackout" class="blackout"></div>
    </section>
  </div>

  <!-- Three.js Library -->
  <script src="./lib/three.min.js"></script>

  <!-- Vertex Shader -->
  <script id="vertexShader" type="x-shader/x-vertex">
    void main() {
        gl_Position = vec4( position, 1.0 );
    }
  </script>

  <!-- Fragment Shader -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    uniform vec2 u_resolution;
    uniform vec2 u_mouse;
    uniform float u_time;
    uniform sampler2D u_noise;

    #define PI 3.141592653589793
    #define TAU 6.

    const float multiplier = 15.5;

    const float zoomSpeed = 10.;
    const int layers = 10;

    const int octaves = 5;

    vec2 hash2(vec2 p)
    {
      vec2 o = texture2D( u_noise, (p+0.5)/256.0, -100.0 ).xy;
      return o;
    }

    mat2 rotate2d(float _angle){
        return mat2(cos(_angle),sin(_angle),
                    -sin(_angle),cos(_angle));
    }

    vec3 hsb2rgb( in vec3 c ){
      vec3 rgb = clamp(abs(mod(c.x*6.0+vec3(0.0,4.0,2.0),
                               6.0)-3.0)-1.0,
                       0.0,
                       1.0 );
      rgb = rgb*rgb*(3.0-2.0*rgb);
      return c.z * mix( vec3(1.0), rgb, c.y);
    }

    float hash(vec2 p)
    {
      float o = texture2D( u_noise, (p+0.5)/256.0, -100.0 ).x;
      return o;
    }
    float noise(vec2 uv) {
      vec2 id = floor(uv);
      vec2 subuv = fract(uv);
      vec2 u = subuv * subuv * (3. - 2. * subuv);
      float a = hash(id);
      float b = hash(id + vec2(1., 0.));
      float c = hash(id + vec2(0., 1.));
      float d = hash(id + vec2(1., 1.));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fbm(in vec2 uv) {
      float s = .0;
      float m = .0;
      float a = .5;
      for(int i = 0; i < octaves; i++) {
        s += a * noise(uv);
        m += a;
        a *= .5;
        uv *= 2.;
      }
      return s / m;
    }

    vec3 domain(vec2 z){
      return vec3(hsb2rgb(vec3(atan(z.y,z.x)/TAU,1.,1.)));
    }
    vec3 colour(vec2 z) {
        return domain(z);
    }

    // The render function is where we render the pattern to be added to the layer
    vec3 render(vec2 uv, float scale, vec3 colour) {
      vec2 id = floor(uv);
      vec2 subuv = fract(uv);
      vec2 rand = hash2(id);
      float bokeh = abs(scale) * 1.;

      float particle = 0.;

      if(length(rand) > 1.3) {
        vec2 pos = subuv-.5;
        float field = length(pos);
        particle = smoothstep(.3, 0., field);
        particle += smoothstep(.4 * bokeh, 0.34 * bokeh, field);
      }
      return vec3(particle*2.);
    }

    vec3 renderLayer(int layer, int layers, vec2 uv, inout float opacity, vec3 colour, float n) {
      vec2 _uv = uv;
      // Scale
      // Generating a scale value between zero and 1 based on a mod of u_time
      // A frequency of 10 dixided by the layer index (10 / layers * layer)
      float scale = mod((u_time + zoomSpeed / float(layers) * float(layer)) / zoomSpeed, -1.);
      uv *= 20.; // The initial scale. Increasing this makes the cells smaller and the "speed" apepar faster
      uv *= scale*scale; // then modifying the overall scale by the generated amount
      // uv *= 1. + ( ( n*.5 ) * ( length(_uv) ) );
      // uv += .5*float(layer);
      uv = rotate2d(u_time / 10.) * uv; // rotarting
      uv += vec2(25. + sin(u_time*.1)) * float(layer); // ofsetting the UV by an arbitrary amount to make the layer appear different

      // render
      vec3 pass = render(uv * multiplier, scale, colour) * .2; // render the pass

       // this is the opacity of the layer fading in from the "bottom"
      opacity = 1. + scale;
      float _opacity = opacity;

      // pass += n * .5 * mix(vec3(0., .5, 1.5), vec3(1., .5, 0.), opacity);

      // This is the opacity of the layer fading out at the top (we want this minimal, hence the smoothstep)
      float endOpacity = smoothstep(0., 0.4, scale * -1.);
      opacity += endOpacity;

      return pass * _opacity * endOpacity;
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy);

        if(u_resolution.y < u_resolution.x) {
          uv /= u_resolution.y;
        } else {
          uv /= u_resolution.x;
        }

        // uv.y += cos(u_time * .1) * .5;
        // uv.x += sin(u_time * .1) * .5;

        // float n = fbm(uv * 3. - 2.);
        float n = fbm((uv + vec2(sin(u_time*.1), u_time*.1)) * 2. - 2.);

        vec3 colour = vec3(0.);
        // Modified color scheme: Teal (brighter) to Purple (darker)
        // Teal: rgb(0, 128, 128) = hsl(180, 100%, 25%) ~ vec3(0., 0.5, 0.5)
        // Purple: rgb(128, 0, 128) = hsl(300, 100%, 25%) ~ vec3(0.5, 0., 0.5)
        // Original was: colour = n * mix(vec3(0., .5, 1.5)*-1.5, clamp(vec3(1., .5, .25)*2., 0., 1.), n);
        colour = n * mix(vec3(0.5, 0.1, 0.6)*1.5, clamp(vec3(0., 0.6, 0.6)*2., 0., 1.), n);

        float opacity = 1.;
        float opacity_sum = 1.;

        for(int i = 1; i <= layers; i++) {
          colour -= renderLayer(i, layers, uv, opacity, colour, n);
          opacity_sum += opacity;
        }

        colour /= opacity_sum;

        gl_FragColor = vec4(clamp(colour * 20., 0., 1.),1.0);
    }
  </script>

  <script type="module">
    import { GameDB } from './data/database.js';

    // ========================================================================
    // STATE MANAGEMENT
    // ========================================================================

    const state = {
      // Character assignment
      allCharacters: [],
      livingCharacters: [], // 3 random Living
      fallenCharacters: [], // 3 random Fallen

      // Selection
      selectedCharacter: null, // Only one can be selected

      // Rerolls
      rerollsRemaining: 3,

      // Animation state
      animationComplete: false,
      canInteract: false
    };

    // ========================================================================
    // DOM REFERENCES
    // ========================================================================

    const elements = {
      cardsContainer: document.getElementById('character-cards'),
      singleRerollBtn: document.getElementById('singleRerollBtn'),
      totalRerollBtn: document.getElementById('totalRerollBtn'),
      confirmBtn: document.getElementById('confirmBtn'),
      titlePanel: document.getElementById('titlePanel'),
      rerollModule: document.getElementById('rerollModule'),
      controlPanel: document.getElementById('controlPanel'),
    };

    // ========================================================================
    // INITIALIZATION
    // ========================================================================

    function init() {
      // Get all characters and randomly assign
      state.allCharacters = GameDB.getAllCharacters();
      assignLivingAndFallen();

      // The canvas animation will handle showing the cards after the intro
      // We'll call createCharacterCards() from the canvas timeline
    }

    function assignLivingAndFallen() {
      const shuffled = [...state.allCharacters].sort(() => Math.random() - 0.5);
      state.livingCharacters = shuffled.slice(0, 3);
      state.fallenCharacters = shuffled.slice(3, 6);
    }

    // ========================================================================
    // CHARACTER CARDS
    // ========================================================================

    function createCharacterCards() {
      elements.cardsContainer.innerHTML = '';

      // Create Living cards (top 3 positions)
      state.livingCharacters.forEach((char, index) => {
        const card = createLivingCard(char, index);
        elements.cardsContainer.appendChild(card);
      });

      // Create Fallen plaques (bottom 3 positions)
      state.fallenCharacters.forEach((char, index) => {
        const plaque = createFallenPlaque(char, index);
        elements.cardsContainer.appendChild(plaque);
      });

      positionCards();
    }

    function createLivingCard(char, index) {
      const card = document.createElement('div');
      card.className = 'character-card';
      card.dataset.index = index;
      card.dataset.charId = char.id;
      card.dataset.type = 'living';

      card.innerHTML = `
        <div class="char-header">
          <div class="char-info">
            <div class="char-name">${char.name}</div>
            <div class="char-title">${char.title}</div>
            <div class="char-role">${char.specialization}</div>
          </div>
        </div>
        ${createInfoBox(char)}
      `;

      card.addEventListener('click', () => handleLivingCardClick(index));

      return card;
    }

    function createFallenPlaque(char, index) {
      const plaque = document.createElement('div');
      plaque.className = 'fallen-plaque';
      plaque.dataset.index = index;
      plaque.dataset.charId = char.id;
      plaque.dataset.type = 'fallen';

      plaque.innerHTML = `
        <div class="char-header">
          <div class="char-info">
            <div class="char-name">${char.name}</div>
            <div class="char-title">${char.title}</div>
            <div class="char-role">${char.specialization}</div>
          </div>
        </div>
        ${createInfoBox(char)}
      `;

      return plaque;
    }

    function createInfoBox(char) {
      return `
        <div class="info-box">
          <div class="info-box-title">Statistics</div>
          <div class="info-box-stats">
            <div class="info-stat">
              <span class="info-stat-label">HP</span>
              <span>${char.baseHP}</span>
            </div>
            <div class="info-stat">
              <span class="info-stat-label">Defense</span>
              <span>${char.baseDefense}</span>
            </div>
            <div class="info-stat">
              <span class="info-stat-label">Speed</span>
              <span>${char.baseSpeed}</span>
            </div>
            <div class="info-stat">
              <span class="info-stat-label">Damage</span>
              <span>${char.damageModifier}x</span>
            </div>
          </div>
          <div class="info-box-quote">${char.quote}</div>
        </div>
      `;
    }

    function positionCards() {
      const cards = Array.from(elements.cardsContainer.children);

      // Get star positions from canvas if available
      const col = [0.30, 0.50, 0.70];

      // Living cards: top row (centered over Living stars)
      const livingPositions = [
        { x: col[0] * 100, y: 35 },
        { x: col[1] * 100, y: 35 },
        { x: col[2] * 100, y: 35 },
      ];

      // Fallen plaques: bottom row (centered over Fallen stars)
      const fallenPositions = [
        { x: col[0] * 100, y: 70 },
        { x: col[1] * 100, y: 70 },
        { x: col[2] * 100, y: 70 },
      ];

      cards.forEach((card, i) => {
        if (card.dataset.type === 'living') {
          const index = parseInt(card.dataset.index);
          const pos = livingPositions[index];
          card.style.left = `${pos.x}%`;
          card.style.top = `${pos.y}%`;
          card.style.transform = 'translate(-50%, -50%)';
        } else if (card.dataset.type === 'fallen') {
          const index = parseInt(card.dataset.index);
          const pos = fallenPositions[index];
          card.style.left = `${pos.x}%`;
          card.style.top = `${pos.y}%`;
          card.style.transform = 'translate(-50%, -50%)';
        }
      });
    }

    function showCharacterCards() {
      const cards = Array.from(elements.cardsContainer.children);
      cards.forEach((card, i) => {
        setTimeout(() => {
          card.classList.add('show');
        }, i * 80);
      });

      if (available.length > 0) {

      } else {

        const randomFallenIndex = Math.floor(Math.random() * state.fallenCharacters.length);
        newChar = state.fallenCharacters[randomFallenIndex];

        state.fallenCharacters[randomFallenIndex] = state.livingCharacters[state.selectedCharacter];

        particle.style.top = `${rect.top + rect.height * Math.random()}px`;
        particle.style.width = `${2 + Math.random() * 3}px`;

        particle.style.pointerEvents = 'none';
        particle.style.zIndex = '500';
        particle.style.transition = 'all 1s ease-out';

        document.body.appendChild(particle);

        requestAnimationFrame(() => {

          particle.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance + 100}px)`;
          particle.style.opacity = '0';

        // Remove particle after animation
        setTimeout(() => {

        }, 1000);

      elements.singleRerollBtn.disabled = state.rerollsRemaining === 0;
      elements.totalRerollBtn.disabled = state.rerollsRemaining === 0;
    }

    // ========================================================================
    // CONFIRMATION
    // ========================================================================

    function confirmSelection() {
      if (!state.canInteract || state.selectedCharacter === null) return;

      const selectedChar = state.livingCharacters[state.selectedCharacter];
      const crew = [selectedChar];

      // Save to localStorage
      localStorage.setItem('selectedCrew', JSON.stringify(crew.map(c => c.id)));

      console.log('Crew selected:', crew);

      alert(`Selected: ${selectedChar.name}\n\n(Next: Navigate to game UI)`);
    }

    // ========================================================================
    // EVENT LISTENERS

    elements.singleRerollBtn.addEventListener('click', performSingleReroll);
    elements.totalRerollBtn.addEventListener('click', performTotalReroll);
    elements.confirmBtn.addEventListener('click', confirmSelection);

    // ========================================================================

        this.tick = 0;

                  ctx.lineTo(p.cx + p.currentX, p.cy + p.currentY);

          } else {
            selectionBurstActive = false;
          }
        }

        // Draw orbs
        for (let i = 0; i < fakeOrbs.length; i++) {
          const pos = orbPositions[i];
          const orb = pos.orb;

          const energyOsc = 0.55 + 0.45 * Math.sin((now * 0.001) * (9.5 + (orb.seed % 7)));
          const energy = clamp((flickerEase * 0.95 + arrangeEase * 0.75) * energyOsc, 0, 1);

          const pulseMult = 1 + pulseAmount * 0.25;
          const pulseAlpha = 1 + pulseAmount * 0.4;

          const orbAlpha = orbsMix * pulseAlpha;
          const orbOpacity = 1 - morphMix * 0.7;

          const rr = pos.r * pulseMult;

          // Stutter effect for Fallen during marking
          let stutterX = 0, stutterY = 0;
          if (orb.isFallen && fallenMarkMix < 0.4) {
            const rand = mulberry32(orb.seed + Math.floor(now / 50));
            stutterX = (rand() - 0.5) * pos.r * 0.15;
            stutterY = (rand() - 0.5) * pos.r * 0.15;
          }

          ctx.globalAlpha = orbOpacity;
          drawOrbOnCanvas(pos.x + stutterX, pos.y + stutterY, rr, orbAlpha, energy, orb.isFallen, fallenMarkEase, orb.seed);
        }

        ctx.globalAlpha = 1;

        rafId = requestAnimationFrame(frame);
      }

      // ========================================================================
      // START FUNCTION
      // ========================================================================

      function startRosterSlice() {
        if (rafId) cancelAnimationFrame(rafId);

        onWindowResize();
        fakeOrbs = [];
        orbsChosen = false;
        burstTriggered = false;
        particleSystems = [];

        // Reset UI
        if (window.rosterElements) {
          window.rosterElements.titlePanel.classList.remove('show');
          window.rosterElements.rerollModule.classList.remove('show');
          window.rosterElements.controlPanel.classList.remove('show');
        }

        blackout.style.transition = 'none';
        blackout.style.opacity = '1';
        blackout.style.display = 'block';

        blackout.getBoundingClientRect();

        if (prefersReduced) {
          blackout.style.opacity = '0';
        } else {
          setTimeout(() => {
            blackout.style.transition = 'opacity 210ms linear';
            blackout.style.opacity = '0';
          }, TIMINGS.blackHold);
        }

        setTimeout(() => {
          blackout.style.display = 'none';
        }, prefersReduced ? 10 : (TIMINGS.blackHold + 280));

        startTime = performance.now();
        rafId = requestAnimationFrame(frame);
      }

      // ========================================================================
      // EVENT HANDLERS
      // ========================================================================

      window.triggerGoldenBurst = function(index) {
        if (index < 0 || index >= 3) return;

        selectionBurstIndex = index;
        selectionBurstStartTime = performance.now();
        selectionBurstActive = true;

        const system = particleSystems[index];
        if (system) {
          for (let j = 0; j < system.particles.length; j++) {
            system.particles[j].reset();
          }
        }
      };

      window.addEventListener('resize', onWindowResize);

      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') {
          startRosterSlice();
        }
      });

      // Initialize Three.js and start animation
      initThreeJS();
      setTimeout(startRosterSlice, 100);
    })();
  </script>
</body>
