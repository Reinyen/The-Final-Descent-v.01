<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roster Selection - The Final Descent</title>
  <style>
    :root{
      --bg:#000;
      --ink:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --card:rgba(10,10,16,.64);
      --stroke:rgba(255,255,255,.10);
      --gold:rgba(255,215,0,.95);
      --echo:rgba(157,78,221,.85);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      overflow:hidden;
    }
    .no-select{user-select:none}

    /* App container */
    #app{position:relative; height:100%; width:100%}

    /* Roster page */
    #roster{
      position:absolute; inset:0;
      background:#000;
      overflow:hidden;
    }

    #space{
      position:absolute; inset:0;
      width:100%; height:100%;
      display:block;
    }

    /* Character cards overlay */
    .character-card {
      position: absolute;
      width: 220px;
      padding: 16px;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 2px solid var(--stroke);
      border-radius: 12px;
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: all;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      z-index: 10;
      cursor: pointer;
    }

    .character-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .character-card:hover {
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(255,255,255,.3);
    }

    .character-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 30px rgba(255,215,0,.3);
    }

    .character-card.echo {
      border-color: var(--echo);
      box-shadow: 0 0 30px rgba(157,78,221,.3);
    }

    .char-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .char-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .char-name {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.02em;
    }

    .char-title {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .char-role {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(255,255,255,.08);
      border-radius: 4px;
      font-size: 11px;
      margin-top: 8px;
      color: var(--gold);
    }

    .char-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 12px;
      font-size: 12px;
    }

    .char-stat {
      display: flex;
      justify-content: space-between;
      padding: 4px;
      background: rgba(255,255,255,.04);
      border-radius: 3px;
    }

    .char-stat-label {
      color: var(--muted);
    }

    .char-quote {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--stroke);
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
    }

    /* Control panel */
    .control-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px 24px;
      background: rgba(0,0,0,.8);
      backdrop-filter: blur(16px);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.6s ease 0.5s;
      z-index: 20;
    }

    .control-panel.show {
      opacity: 1;
    }

    .control-btn {
      padding: 10px 20px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--stroke);
      border-radius: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .control-btn:hover:not(:disabled) {
      background: rgba(255,255,255,.15);
      border-color: rgba(255,255,255,.3);
      transform: translateY(-1px);
    }

    .control-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .control-btn.primary {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .control-btn.primary:hover:not(:disabled) {
      background: rgba(255,215,0,1);
      box-shadow: 0 0 20px rgba(255,215,0,.4);
    }

    .reroll-count {
      font-size: 11px;
      color: var(--muted);
      margin-left: 8px;
    }

    /* Selection indicator */
    .selection-count {
      padding: 8px 16px;
      background: rgba(255,215,0,.1);
      border: 1px solid var(--gold);
      border-radius: 6px;
      font-size: 13px;
      color: var(--gold);
    }

    /* Info panel */
    .info-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 16px 20px;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      max-width: 320px;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
      z-index: 15;
    }

    .info-panel.show {
      opacity: 1;
    }

    .info-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .info-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .echo-warning {
      margin-top: 12px;
      padding: 10px;
      background: rgba(157,78,221,.15);
      border: 1px solid var(--echo);
      border-radius: 6px;
      font-size: 12px;
      color: var(--echo);
    }

    /* Vignette */
    .vignette{
      position:absolute; inset:-2px;
      background:radial-gradient(1200px 900px at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.62) 100%);
      pointer-events:none;
      z-index: 5;
    }

    @media (prefers-reduced-motion: reduce){
      .character-card, .control-panel, .info-panel {
        transition: none;
      }
    }
  </style>
</head>
<body class="no-select">
  <div id="app">
    <section id="roster">
      <canvas id="space" aria-hidden="true"></canvas>

      <!-- Info Panel -->
      <div class="info-panel">
        <div class="info-title">Crew Selection</div>
        <div class="info-text">
          Three crew members will descend into the station. The others will become Echoes—hostile entities you'll encounter in the depths.
        </div>
        <div class="echo-warning">
          ⚠️ Choose carefully. Those left behind are lost forever.
        </div>
      </div>

      <!-- Character Cards (6 total, generated dynamically) -->
      <div id="character-cards"></div>

      <!-- Control Panel -->
      <div class="control-panel">
        <button class="control-btn" id="fullRerollBtn">
          Full Reroll
          <span class="reroll-count" id="fullRerollCount">(2)</span>
        </button>
        <button class="control-btn" id="singleSwapBtn">
          Single Swap
          <span class="reroll-count" id="singleSwapCount">(1)</span>
        </button>
        <div class="selection-count" id="selectionCount">0 / 3 Selected</div>
        <button class="control-btn primary" id="confirmBtn" disabled>
          Confirm Selection
        </button>
      </div>

      <div class="vignette"></div>
    </section>
  </div>

  <script type="module">
    import { GameDB } from './data/database.js';

    // ========================================================================
    // STATE MANAGEMENT
    // ========================================================================

    const state = {
      // Crew selection
      allCharacters: [],
      currentDraw: [],
      selectedIndices: new Set(),

      // Reroll counts
      fullRerollsLeft: 2,
      singleSwapsLeft: 1,

      // Selection mode
      selectionMode: 'normal', // 'normal' | 'swap'

      // UI timing
      animationComplete: false
    };

    // ========================================================================
    // DOM REFERENCES
    // ========================================================================

    const elements = {
      cardsContainer: document.getElementById('character-cards'),
      fullRerollBtn: document.getElementById('fullRerollBtn'),
      singleSwapBtn: document.getElementById('singleSwapBtn'),
      confirmBtn: document.getElementById('confirmBtn'),
      selectionCount: document.getElementById('selectionCount'),
      fullRerollCount: document.getElementById('fullRerollCount'),
      singleSwapCount: document.getElementById('singleSwapCount'),
      infoPanel: document.querySelector('.info-panel'),
      controlPanel: document.querySelector('.control-panel')
    };

    // ========================================================================
    // INITIALIZATION
    // ========================================================================

    function init() {
      // Initial draw from database
      state.allCharacters = GameDB.getAllCharacters();
      state.currentDraw = GameDB.initialCrewDraw();

      // Create character cards
      createCharacterCards();

      // Setup event listeners
      setupEventListeners();

      // Show UI after animation
      setTimeout(() => {
        state.animationComplete = true;
        elements.infoPanel.classList.add('show');
        elements.controlPanel.classList.add('show');
        showCharacterCards();
      }, 4800); // After burst + arrange completes
    }

    // ========================================================================
    // CHARACTER CARDS
    // ========================================================================

    function createCharacterCards() {
      elements.cardsContainer.innerHTML = '';

      state.currentDraw.forEach((char, index) => {
        const card = createCard(char, index);
        elements.cardsContainer.appendChild(card);
      });

      positionCards();
    }

    function createCard(char, index) {
      const card = document.createElement('div');
      card.className = 'character-card';
      card.dataset.index = index;
      card.dataset.charId = char.id;

      const displayInfo = GameDB.getCharacterDisplayInfo(char.id);

      card.innerHTML = `
        <div class="char-header">
          <div class="char-color-dot" style="background: ${char.color}"></div>
          <div>
            <div class="char-name">${displayInfo.name}</div>
            <div class="char-title">${displayInfo.title}</div>
          </div>
        </div>
        <div class="char-role">${displayInfo.specialization}</div>
        <div class="char-stats">
          <div class="char-stat">
            <span class="char-stat-label">HP</span>
            <span>${displayInfo.stats.hp}</span>
          </div>
          <div class="char-stat">
            <span class="char-stat-label">Defense</span>
            <span>${displayInfo.stats.defense}</span>
          </div>
          <div class="char-stat">
            <span class="char-stat-label">Speed</span>
            <span>${displayInfo.stats.speed}</span>
          </div>
          <div class="char-stat">
            <span class="char-stat-label">Damage</span>
            <span>${displayInfo.stats.damageModifier}</span>
          </div>
        </div>
        <div class="char-quote">${displayInfo.quote}</div>
      `;

      // Click to select/deselect
      card.addEventListener('click', () => handleCardClick(index));

      return card;
    }

    function positionCards() {
      // Position cards near their stars (2 rows of 3)
      const cards = elements.cardsContainer.children;
      const positions = [
        { x: 30, y: 42 },  // Top row
        { x: 50, y: 42 },
        { x: 70, y: 42 },
        { x: 30, y: 63 },  // Bottom row
        { x: 50, y: 63 },
        { x: 70, y: 63 }
      ];

      Array.from(cards).forEach((card, i) => {
        if (i < positions.length) {
          const pos = positions[i];
          card.style.left = `calc(${pos.x}% - 110px)`;  // Center card (220px / 2)
          card.style.top = `${pos.y}%`;
        }
      });
    }

    function showCharacterCards() {
      const cards = elements.cardsContainer.children;
      Array.from(cards).forEach((card, i) => {
        setTimeout(() => {
          card.classList.add('show');
        }, i * 100);
      });
    }

    function handleCardClick(index) {
      if (!state.animationComplete) return;

      if (state.selectionMode === 'swap') {
        // In swap mode, clicking replaces this card
        performSingleSwap(index);
        return;
      }

      // Normal selection mode
      if (state.selectedIndices.has(index)) {
        state.selectedIndices.delete(index);
      } else {
        if (state.selectedIndices.size < 3) {
          state.selectedIndices.add(index);
        }
      }

      updateCardStates();
      updateSelectionCount();
    }

    function updateCardStates() {
      const cards = elements.cardsContainer.children;
      Array.from(cards).forEach((card, i) => {
        if (state.selectedIndices.has(i)) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });
    }

    function updateSelectionCount() {
      elements.selectionCount.textContent = `${state.selectedIndices.size} / 3 Selected`;
      elements.confirmBtn.disabled = state.selectedIndices.size !== 3;
    }

    // ========================================================================
    // REROLL LOGIC
    // ========================================================================

    function performFullReroll() {
      if (state.fullRerollsLeft <= 0) return;

      state.fullRerollsLeft--;
      state.currentDraw = GameDB.fullReroll();
      state.selectedIndices.clear();

      // Fade out cards
      const cards = elements.cardsContainer.children;
      Array.from(cards).forEach(card => {
        card.classList.remove('show');
      });

      // Recreate after animation
      setTimeout(() => {
        createCharacterCards();
        setTimeout(() => showCharacterCards(), 50);
        updateRerollCounts();
        updateSelectionCount();
      }, 400);
    }

    function performSingleSwap(index) {
      if (state.singleSwapsLeft <= 0) return;

      // Get the two characters to keep
      const keepIndices = Array.from({length: 3}, (_, i) => i).filter(i => i !== index);
      const keepIds = keepIndices.map(i => state.currentDraw[i].id);

      // Get new character
      const newChar = GameDB.singleSwap(keepIds);

      // Replace in current draw
      state.currentDraw[index] = newChar;
      state.singleSwapsLeft--;
      state.selectionMode = 'normal';

      // Update specific card
      const card = elements.cardsContainer.children[index];
      card.classList.remove('show');

      setTimeout(() => {
        const newCard = createCard(newChar, index);
        elements.cardsContainer.replaceChild(newCard, card);
        positionCards();
        setTimeout(() => newCard.classList.add('show'), 50);
        updateRerollCounts();
        resetSwapMode();
      }, 400);
    }

    function initiateSingleSwap() {
      if (state.singleSwapsLeft <= 0) return;
      if (state.selectedIndices.size !== 2) {
        alert('Select exactly 2 characters to keep, then click the one to replace.');
        return;
      }

      state.selectionMode = 'swap';
      // Visual feedback: highlight non-selected cards
      const cards = elements.cardsContainer.children;
      Array.from(cards).forEach((card, i) => {
        if (!state.selectedIndices.has(i)) {
          card.style.borderColor = 'rgba(255, 215, 0, 0.5)';
        }
      });
    }

    function resetSwapMode() {
      state.selectionMode = 'normal';
      state.selectedIndices.clear();
      updateCardStates();
      updateSelectionCount();
    }

    function updateRerollCounts() {
      elements.fullRerollCount.textContent = `(${state.fullRerollsLeft})`;
      elements.singleSwapCount.textContent = `(${state.singleSwapsLeft})`;
      elements.fullRerollBtn.disabled = state.fullRerollsLeft === 0;
      elements.singleSwapBtn.disabled = state.singleSwapsLeft === 0;
    }

    // ========================================================================
    // CONFIRMATION
    // ========================================================================

    function confirmSelection() {
      if (state.selectedIndices.size !== 3) return;

      const selectedCrew = Array.from(state.selectedIndices).map(i => state.currentDraw[i]);
      const selectedIds = selectedCrew.map(c => c.id);
      const echoes = GameDB.getEchoesFromSelection(selectedIds);

      // Save to localStorage
      localStorage.setItem('selectedCrew', JSON.stringify(selectedIds));
      localStorage.setItem('echoes', JSON.stringify(echoes.map(e => e.originalId)));

      console.log('Selected Crew:', selectedCrew);
      console.log('Echoes:', echoes);

      // TODO: Transition to map/game
      alert(`Crew selected!\n\nLiving:\n${selectedCrew.map(c => `- ${c.name}`).join('\n')}\n\nEchoes:\n${echoes.map(e => `- ${e.displayName}`).join('\n')}\n\n(Next: Navigate to map UI)`);
    }

    // ========================================================================
    // EVENT LISTENERS
    // ========================================================================

    function setupEventListeners() {
      elements.fullRerollBtn.addEventListener('click', performFullReroll);
      elements.singleSwapBtn.addEventListener('click', initiateSingleSwap);
      elements.confirmBtn.addEventListener('click', confirmSelection);
    }

    // ========================================================================
    // START
    // ========================================================================

    init();

    // Make GameDB available for console debugging
    window.GameDB = GameDB;
    window.state = state;
  </script>

  <!-- Starfield rendering (same as roster.html) -->
  <script>
    (function(){
      "use strict";

      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let stars = [];
      let sprites = [];
      let rafId = null;
      let startTime = 0;
      let specialIdx = [];
      let specialChosen = false;
      let W = 0, H = 0, DPR = 1;

      const TIMINGS = {
        blackHold: 875,
        bgFade: 525,
        twinkleRamp: 1750,
        specialFlicker: 1050,
        burst: 400,
        arrange: 2800,
      };

      function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
      function lerp(a,b,t){ return a + (b-a)*t; }
      function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }
      function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

      function resize(){
        const rect = canvas.getBoundingClientRect();
        DPR = clamp(window.devicePixelRatio || 1, 1, 2);
        W = Math.max(1, Math.floor(rect.width));
        H = Math.max(1, Math.floor(rect.height));
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function makeStarSprite(baseR){
        const pad = Math.ceil(baseR * 6);
        const size = pad * 2;
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const g = c.getContext('2d');
        const cx = pad, cy = pad;

        let grd = g.createRadialGradient(cx, cy, 0, cx, cy, pad);
        grd.addColorStop(0.00, 'rgba(255,255,255,0.80)');
        grd.addColorStop(0.12, 'rgba(255,255,255,0.55)');
        grd.addColorStop(0.32, 'rgba(200,220,255,0.20)');
        grd.addColorStop(1.00, 'rgba(0,0,0,0.0)');
        g.fillStyle = grd;
        g.fillRect(0,0,size,size);

        grd = g.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.6);
        grd.addColorStop(0.00, 'rgba(255,255,255,1.00)');
        grd.addColorStop(0.50, 'rgba(255,255,255,0.75)');
        grd.addColorStop(1.00, 'rgba(255,255,255,0.00)');
        g.fillStyle = grd;
        g.beginPath();
        g.arc(cx, cy, baseR * 1.6, 0, Math.PI*2);
        g.fill();

        return { canvas:c, baseR, size };
      }

      function buildSprites(){
        sprites = [
          makeStarSprite(0.55),
          makeStarSprite(0.85),
          makeStarSprite(1.20),
          makeStarSprite(1.70),
        ];
      }

      function pickSpriteIdx(r){
        if (r < 0.7) return 0;
        if (r < 1.0) return 1;
        if (r < 1.4) return 2;
        return 3;
      }

      function buildStars(count){
        stars = new Array(count);
        for (let i=0; i<count; i++){
          const nx = Math.random();
          const ny = Math.pow(Math.random(), 0.78);

          const u = Math.random();
          const r = (u < 0.86) ? lerp(0.35, 0.95, Math.random()) :
                    (u < 0.98) ? lerp(0.95, 1.55, Math.random()) :
                                 lerp(1.55, 2.25, Math.random());

          const a = clamp(lerp(0.10, 0.95, Math.pow(Math.random(), 0.58)), 0.06, 0.98);

          const twAmp = lerp(0.08, 0.38, Math.random());
          const twSpd = lerp(0.35, 1.85, Math.random());
          const twPh = Math.random() * Math.PI * 2;
          const seed = (Math.random() * 1e9) | 0;
          const spriteIdx = pickSpriteIdx(r);

          stars[i] = { nx, ny, r, a, twAmp, twSpd, twPh, seed, spriteIdx };
        }
      }

      function chooseSpecialStars(){
        if (specialChosen) return;
        specialChosen = true;

        const picks = new Set();
        while (picks.size < 6) picks.add((Math.random() * stars.length) | 0);
        specialIdx = Array.from(picks);

        for (let k=0; k<specialIdx.length; k++){
          const s = stars[specialIdx[k]];
          s.special = true;
          s.sx0 = s.nx;
          s.sy0 = s.ny;
        }
      }

      function computeTargets(){
        const col = [0.30, 0.50, 0.70];
        const row = [0.42, 0.63];
        const targets = [];
        for (let r=0; r<2; r++){
          for (let c=0; c<3; c++){
            targets.push({ nx: col[c], ny: row[r] });
          }
        }
        return targets;
      }

      function drawBackground(bgOpacity){
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,W,H);

        if (bgOpacity <= 0) return;

        const gx = W * 0.5;
        const gy = H * 1.06;
        const radius = Math.max(W, H) * 1.05;
        const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, radius);
        grd.addColorStop(0.00, `rgba(170, 90, 255, ${0.55 * bgOpacity})`);
        grd.addColorStop(0.18, `rgba(120, 40, 235, ${0.30 * bgOpacity})`);
        grd.addColorStop(0.42, `rgba(60, 10, 130, ${0.16 * bgOpacity})`);
        grd.addColorStop(0.72, `rgba(10, 8, 20, ${0.08 * bgOpacity})`);
        grd.addColorStop(1.00, `rgba(0, 0, 0, 0)`);
        ctx.fillStyle = grd;
        ctx.fillRect(0,0,W,H);

        const v = ctx.createLinearGradient(0,0,0,H);
        v.addColorStop(0.0, `rgba(0,0,0,${0.75 * (1-bgOpacity)})`);
        v.addColorStop(0.35, 'rgba(0,0,0,0)');
        v.addColorStop(1.0, `rgba(0,0,0,0)`);
        ctx.fillStyle = v;
        ctx.fillRect(0,0,W,H);
      }

      function drawStarSprite(x, y, r, alpha, spriteIdx){
        const spr = sprites[spriteIdx];
        const scale = r / spr.baseR;
        const size = spr.size * scale;
        ctx.globalAlpha = alpha;
        ctx.drawImage(spr.canvas, x - size/2, y - size/2, size, size);
      }

      function drawSpecialStar(x, y, r, alpha, energy){
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'lighter';

        const haloR = r * lerp(1.7, 2.15, energy);
        let grd = ctx.createRadialGradient(x, y, 0, x, y, haloR);
        grd.addColorStop(0.00, `rgba(255, 230, 170, ${0.60 * energy})`);
        grd.addColorStop(0.12, `rgba(255, 205, 110, ${0.48 * energy})`);
        grd.addColorStop(0.35, `rgba(255, 165, 40, ${0.22 * energy})`);
        grd.addColorStop(1.00, `rgba(0, 0, 0, 0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(x, y, haloR, 0, Math.PI*2);
        ctx.fill();

        grd = ctx.createRadialGradient(x, y, 0, x, y, r * 1.35);
        grd.addColorStop(0.00, `rgba(255,255,255,${0.90 * alpha})`);
        grd.addColorStop(0.20, `rgba(255,240,200,${0.78 * alpha})`);
        grd.addColorStop(0.55, `rgba(255,190,80,${0.34 * alpha})`);
        grd.addColorStop(1.00, `rgba(0,0,0,0)`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(x, y, r * 1.35, 0, Math.PI*2);
        ctx.fill();

        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = clamp(alpha + 0.25, 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.beginPath();
        ctx.arc(x, y, Math.max(1.2, r * 0.28), 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
      }

      function frame(now){
        const t = now - startTime;

        const tBlackEnd = TIMINGS.blackHold;
        const tBgEnd = tBlackEnd + TIMINGS.bgFade;
        const tTwinkleEnd = tBgEnd + TIMINGS.twinkleRamp;
        const tFlickerEnd = tTwinkleEnd + TIMINGS.specialFlicker;
        const tBurstEnd = tFlickerEnd + TIMINGS.burst;
        const tArrangeEnd = tBurstEnd + TIMINGS.arrange;

        const bgOpacity = prefersReduced ? 1 : clamp((t - tBlackEnd) / TIMINGS.bgFade, 0, 1);
        const twinkleMix = prefersReduced ? 1 : clamp((t - tBgEnd) / TIMINGS.twinkleRamp, 0, 1);

        if (!specialChosen && (prefersReduced || t >= tTwinkleEnd)) chooseSpecialStars();

        const flickerMix = prefersReduced ? 1 : clamp((t - tTwinkleEnd) / TIMINGS.specialFlicker, 0, 1);
        const flickerEase = easeOutCubic(flickerMix);

        const burstMix = prefersReduced ? 1 : clamp((t - tFlickerEnd) / TIMINGS.burst, 0, 1);
        const arrangeMix = prefersReduced ? 1 : clamp((t - tBurstEnd) / TIMINGS.arrange, 0, 1);
        const arrangeEase = easeInOutCubic(arrangeMix);

        drawBackground(bgOpacity);

        const minDim = Math.min(W, H);
        const specialTargetR = minDim * 0.04;
        const targets = computeTargets();

        const specialPos = new Map();
        for (let i=0; i<specialIdx.length; i++){
          const s = stars[specialIdx[i]];
          const ox = s.nx * W;
          const oy = s.ny * H;
          const tx = targets[i].nx * W;
          const ty = targets[i].ny * H;
          const x = lerp(ox, tx, arrangeEase);
          const y = lerp(oy, ty, arrangeEase);
          const r = lerp(s.r, specialTargetR, arrangeEase);
          specialPos.set(specialIdx[i], { x, y, r, ox, oy, tx, ty });
        }

        ctx.globalCompositeOperation = 'source-over';
        for (let i=0; i<stars.length; i++){
          const s = stars[i];
          if (s.special) continue;
          const x = s.nx * W;
          const y = s.ny * H;
          const tw = Math.sin(s.twPh + (now * 0.001) * s.twSpd * 2.0);
          const a = clamp(s.a * (1 + twinkleMix * s.twAmp * tw), 0.02, 1);
          const r = s.r * (1 + twinkleMix * 0.08 * tw);
          drawStarSprite(x, y, r, a, s.spriteIdx);
        }

        for (let i=0; i<specialIdx.length; i++){
          const idx = specialIdx[i];
          const s = stars[idx];
          const p = specialPos.get(idx);
          if (!p) continue;

          const tw = Math.sin(s.twPh + (now * 0.001) * s.twSpd * 1.6);
          const baseA = clamp(s.a * (1 + twinkleMix * 0.22 * tw), 0.08, 1);

          const energyOsc = 0.55 + 0.45 * Math.sin((now * 0.001) * (9.5 + (s.seed % 7)) + s.twPh);
          const energy = clamp((flickerEase * 0.95 + arrangeEase * 0.75) * energyOsc, 0, 1);

          const breathe = 1 + 0.03 * energy * Math.sin((now * 0.001) * 4.0 + s.twPh);
          const rr = p.r * breathe;

          drawSpecialStar(p.x, p.y, rr, baseA, energy);

          ctx.globalCompositeOperation = 'lighter';
          drawStarSprite(p.x, p.y, Math.max(1.6, rr * 0.22), clamp(0.55 + 0.45*energy, 0, 1), 2);
          ctx.globalCompositeOperation = 'source-over';
        }

        rafId = requestAnimationFrame(frame);
      }

      function startRosterSlice(){
        if (rafId) cancelAnimationFrame(rafId);

        resize();
        buildSprites();
        buildStars(3000);
        specialIdx = [];
        specialChosen = false;

        startTime = performance.now();
        rafId = requestAnimationFrame(frame);
      }

      window.addEventListener('resize', () => {
        resize();
      });

      startRosterSlice();
    })();
  </script>
</body>
</html>
